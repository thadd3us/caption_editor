[project]
name = "transcribe"
version = "0.1.0"
description = "Media transcription and speaker diarization tool using NVIDIA Parakeet TDT and pyannote.audio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "librosa>=0.11.0",
    "megatron-core>=0.10.0",
    # Ceiling at <3: nemo-toolkit 3.0 is a major and drags `transformers` to 5.x
    # with it. Both are the ASR path's engine, so that pair moves on its own.
    "nemo-toolkit[asr]>=2.5.0,<3",
    "numpy>=2.0",
    "pandas>=2.0.0",
    "pydantic>=2.12.3",
    "scikit-learn>=1.6.0",
    "soundfile>=0.13.1",
    "syrupy>=5.0.0",
    "tqdm>=4.66.0",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    # Bounded by the `nemo-toolkit<3` ceiling above, which is what actually
    # decides the band: nemo 2.7.x pins `transformers>=4.57,<4.58`, so the
    # resolver lands on 4.57.x by following nemo. The explicit `<5` is here so
    # that lifting the nemo ceiling doesn't silently also lift this one —
    # transformers 5 is a major and wants its own change.
    "transformers>=4.53.0,<5",
    "typer>=0.20.0",
    # Diarization dependencies
    "pyannote-audio>=4.0.0",
    "torchvision>=0.15.0",
    "pybind11>=3.0.1",
    "libsql-client>=0.3.0",
    #    "torchcodec",
    "imageio-ffmpeg>=0.6.0",
    "json5>=0.14.0",
    "umap-learn>=0.5.11",
    # Remote GPU worker for microsoft/VibeVoice-ASR-HF (9B model, doesn't fit
    # locally on most laptops). See transcribe/vibevoice_modal.py.
    "modal>=0.64",
]

[project.scripts]
transcribe_cli = "transcribe_cli:app"
diarize = "diarize:app"
embed_cli = "embed_cli:app"
bulk_cli = "bulk_cli:app"

[dependency-groups]
dev = [
    "onnxruntime>=1.26.0",
    "onnxscript>=0.7.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    # Developer tooling. `uv sync` / `uv run` install dev groups by default, so the
    # pre-commit hook still finds them; `uv export --no-dev` (which generates
    # requirements_bazel.txt) now does not, keeping them out of Bazel's @py_pip hub and
    # out of the environment uvx builds on a user's machine for ASR.
    "ruff>=0.15.0",
    "pyright>=1.1.408",
]

[tool.uv]
# 7-day dependency cooldown: only allow package versions published at least 7 days ago.
# Update this date periodically (it's not rolling — it's a fixed point in time).
exclude-newer = "2026-10-30T00:00:00Z"

# Override nemo-toolkit's conservative `numpy<2.0` constraint — it
# works fine on numpy 2.x and the project depends on numpy 2.x for
# torch interop. Upper bound intentionally absent: previously pinned
# `<2.4` because numba lagged, but numba 0.65+ supports the newer
# numpy ABI so we let the resolver pick the latest.
#
# Override torchcodec to only install on platforms with prebuilt
# wheels. pyannote-audio 4.0+ made torchcodec optional and falls back
# to torchaudio when missing — see diarization/cli.py.
override-dependencies = [
    "numpy>=2.0",
    "torchcodec>=0.6.0; (sys_platform == 'darwin') or (sys_platform == 'win32') or (sys_platform == 'linux' and platform_machine == 'x86_64')"
]

[tool.uv.sources]
# torchcodec is made optional via override-dependencies above
# On platforms without torchcodec wheels (Linux aarch64), pyannote.audio will use torchaudio for audio loading
# See diarization/cli.py which preloads audio using torchaudio to support both scenarios

[tool.setuptools]
# Use find_packages to discover Python modules, exclude test directories
py-modules = [
    "audio_utils",
    "bulk_cli",
    "transcribe_cli",
    "embed_cli",
    "asr_results_to_captions",
    "captions_json5_lib",
    "capture_raw_asr_output",
    "constants",
    "recognizer",
    "repo_root",
    "schema",
]

# Ruff was a dependency with no configuration and nothing running it. The rule set is
# spelled out here so that what the pre-commit hook and CI enforce is a property of the
# repo rather than of whichever ruff version a developer happens to have.
#
# No `line-length`: the tree is already formatted at ruff's default, and overriding it
# reformats 16 files for no reason.
[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus import sorting. Deliberately narrow: this is the
# set the tree passes today, so the gate is green from the first commit and every future
# failure is a real regression rather than inherited debt someone has to triage.
#
# What E/F buy is not style — undefined names, unused imports, f-strings with no
# placeholders, duplicate dict keys. `I` is mechanical and was auto-fixed when it went in.
select = ["E4", "E7", "E9", "F", "I"]

# Worth turning on later, with counts measured on this tree at the time of writing:
#   UP   73  `List[x]` -> `list[x]`, `Optional[x]` -> `x | None` (mostly auto-fixable)
#   B    16  raise-without-from, zip-without-strict, assert-raises-Exception
#   SIM   2  collapsible if, `in dict.keys()`
# Each is a real improvement, but together they rewrite annotations across every module,
# which does not belong in the same change as switching the gate on. Note that B008
# (function-call-in-default-argument) fires 8 times on `typer.Option(...)` defaults and is
# a false positive for typer — it needs
# `flake8-bugbear.extend-immutable-calls = ["typer.Option", "typer.Argument"]` rather than
# a code change.

[tool.coverage.run]
omit = [
    "capture_raw_asr_output.py",
    "__snapshots__/*",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "test_data*", "test_fixtures*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


