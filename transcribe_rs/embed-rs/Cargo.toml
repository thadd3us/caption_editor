[package]
name = "embed-rs-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true
description = "Rust replacement for transcribe/embed_cli.py."

[[bin]]
name = "embed-rs"
path = "src/main.rs"

[dependencies]
caption-core = { path = "../caption-core" }
caption-schema = { path = "../caption-schema" }
clap = { workspace = true }
eyre = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true }
hound = { workspace = true }
ndarray = { workspace = true }
ort = { workspace = true }
knf-rs = { workspace = true }
tempfile = "3"
umap-rs = { workspace = true }
rand = { workspace = true }

# CoreML is an Apple framework; see the note in ../transcribe-rs/Cargo.toml.
# macOS keeps the CoreML execution provider, Linux falls back to ort's CPU
# provider, which `ort/default` already brings in.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[features]
default = ["ort-defaults"]
ort-defaults = ["ort/default"]
