[workspace]
resolver = "2"
members = [
    "caption-schema",
    "caption-core",
    "transcribe-rs",
    "embed-rs",
]

[workspace.package]
edition = "2021"
license = "MIT"
# Kept in lockstep with electron/constants.ts `APP_VERSION` and enforced
# by //tools/bazel:version_consistency_test.
#
# These binaries are *bundled*, not downloaded: electron-builder's
# `extraResources` copies them from `dist-rust/` into the packaged app
# (Contents/Resources/bin on macOS, resources/bin in the .deb), so an app
# update replaces them atomically and nothing fetches them at runtime. The
# version matters for `--version` output and for the release asset names, not
# for resolving a download. (An earlier version of this comment claimed the
# app downloaded them by version tag. It does not, and never did on this
# code path — there is no download logic in electron/ or scripts/.)
#
# Bump procedure: see ../CLAUDE.md → "Version Management".
version = "1.9.5"
publish = false

[workspace.dependencies]
# Shared deps — workspace-pinned so every crate gets the same version
# (and Cargo's resolver picks one copy in the build graph).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
thiserror = "2"
hound = "3.5"
ndarray = "0.17"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
# Hard-pinned with `=`, and that matters: ort is a prerelease, and Cargo's caret
# rules treat `2.0.0-rc.12` as `^2.0.0-rc.12`, which happily resolves up to
# rc.15. parakeet-rs 0.3.x only asks for `^2.0.0-rc.13` but its code does NOT
# compile against rc.15 (`SessionBuilder::new()` gained a parameter), so a plain
# `cargo update` silently produces a tree that fails to build — in parakeet's
# own source as well as ours. Upstream fixed the under-constraint from 0.4.1 on,
# where the requirement became `=2.0.0-rc.15`.
#
# So this `=` is what holds the ort/parakeet pair together. Moving to rc.15 means
# moving parakeet-rs to 0.4.x at the same time and fixing the
# `SessionBuilder::new()` call sites (embed-rs/src/main.rs, transcribe-rs) —
# one change, not a dependency bump. Aligning on a single version across the
# workspace also keeps Cargo from linking two onnxruntime native libs.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24"] }
knf-rs = "0.3"
parakeet-rs = { version = "0.3", default-features = false, features = ["cpu", "ort-defaults"] }
# whisper-rs wraps whisper.cpp; build chain is cmake + bindgen + C++17,
# the same shape as knf-rs-sys we already build under rules_rust.
# Default features link whisper.cpp's bundled GGML implementation; we
# don't enable coreml/metal here to keep the build simple.
whisper-rs = { version = "0.14", default-features = false, features = [] }
insta = { version = "1", features = ["json", "yaml"] }
umap-rs = "0.4"
rand = "0.9"
